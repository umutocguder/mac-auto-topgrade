<!-- Created by 11Hopem -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Outer circular orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" />

  <!-- Upward upgrade arrow and terminal shield -->
  <g filter="url(#glow)">
    <!-- Rotating arc arrow -->
    <path d="M 256 96 A 160 160 0 0 1 416 256" fill="none" stroke="url(#cyanAccent)" stroke-width="14" stroke-linecap="round" />
    <polygon points="406,236 430,256 406,276" fill="url(#cyanAccent)" />
    
    <path d="M 256 416 A 160 160 0 0 1 96 256" fill="none" stroke="url(#cyanAccent)" stroke-width="14" stroke-linecap="round" />
    <polygon points="106,276 82,256 106,236" fill="url(#cyanAccent)" />

    <!-- Center hexagon badge -->
    <polygon points="256,156 336,206 336,306 256,356 176,306 176,206" fill="#0f172a" stroke="url(#cyanAccent)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Bold Chevron Upward Arrow -->
    <path d="M 220 274 L 256 238 L 292 274" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 220 240 L 256 204 L 292 240" fill="none" stroke="url(#cyanAccent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Signature Tag -->
  <text x="256" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">11HOPEM AUTO-TOPGRADE</text>
</svg>
